# Shared Gazebo clock.
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# The generated swarm model variants publish identical sensor APIs under one
# namespace per physical vehicle. Keep Gazebo and ROS names equal.
- ros_topic_name: "/drone_1/scan_3d/points"
  gz_topic_name: "/drone_1/scan_3d/points"
